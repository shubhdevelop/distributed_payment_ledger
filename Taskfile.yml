# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GREETING: Hello, world!

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  build:
    desc: Build the go binary
    cmds:
      - go build -o ./target/main ./cmd/main.go
    silent: false

  dev:
    desc: Runs the binary
    cmds:
      - docker compose up -d
    silent: true

  logs:
    desc: Runs the binary
    cmds:
      - docker compose logs -f app
    silent: false

  vc:
    desc: Runs the valkey-cli
    cmds:
      - valkey-cli
    silent: false

  start:
    desc: Runs the binary
    cmds:
      - ./target/build
    silent: false
